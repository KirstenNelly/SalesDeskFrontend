<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SalesDesk POS | Products</title>
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="stylesheet" href="../shared/css/design-tokens.css" />
    <link rel="stylesheet" href="../shared/css/base.css" />
    <link rel="stylesheet" href="../shared/css/components.css" />
    <link rel="stylesheet" href="../shared/css/layout.css" />
  </head>
  <body>
    <div id="layout-root"></div>
    <script type="module">
      import { requireRole } from '../shared/js/auth-guard.js';
      import { renderLayout } from '../shared/js/layout.js';
      import { demoProducts } from '../shared/js/demo-data.js';
      if (!requireRole('ADMIN')) {
        throw new Error('Unauthorized');
      }
      renderLayout('Products');
      const contentWrapper = document.querySelector('.content-wrapper');
      contentWrapper.innerHTML = `
        <section class="grid">
          <div class="page-header">
            <div>
              <h2>Product catalog</h2>
              <p class="muted">Manage the catalog, pricing, stock, and categories from one place.</p>
            </div>
            <span class="chip">${demoProducts.length} active SKUs</span>
          </div>
          <div class="stats-grid">
            <article class="card metric-card">
              <h3>Fast movers</h3>
              <strong>3</strong>
              <span class="muted">Items above 15 units sold</span>
            </article>
            <article class="card metric-card">
              <h3>Low stock</h3>
              <strong>2</strong>
              <span class="muted">Trigger reorder soon</span>
            </article>
          </div>
          <article class="card table-card">
            <div id="product-table" class="table-list"></div>
          </article>
        </section>
      `;
      document.getElementById('product-table').innerHTML = demoProducts.map((product) => `
        <div class="table-row">
          <div>
            <strong>${product.name}</strong>
            <p class="muted">${product.sku}</p>
          </div>
          <div><strong>${product.category}</strong></div>
          <div><span class="chip ${product.stock <= 5 ? 'warning' : 'success'}">Stock ${product.stock}</span></div>
          <div><strong>KES ${product.price}</strong></div>
        </div>
      `).join('');
    </script>
  </body>
</html>
