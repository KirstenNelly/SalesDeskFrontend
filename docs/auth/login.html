<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SalesDesk POS | Sign in</title>
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="stylesheet" href="../shared/css/design-tokens.css" />
    <link rel="stylesheet" href="../shared/css/base.css" />
    <link rel="stylesheet" href="../shared/css/components.css" />
    <link rel="stylesheet" href="../shared/css/layout.css" />
  </head>
  <body>
    <div id="layout-root"></div>
    <main class="auth-page">
      <section class="auth-card">
        <div class="auth-card__header">
          <p class="eyebrow">SalesDesk POS</p>
          <h1>Welcome back</h1>
          <p>Sign in to access the administrator or cashier workspace.</p>
        </div>
        <form id="login-form" class="stack">
          <label class="field">
            <span>Email or username</span>
            <input id="username" name="username" type="text" autocomplete="username" required />
          </label>
          <label class="field">
            <span>Password</span>
            <input id="password" name="password" type="password" autocomplete="current-password" required />
          </label>
          <button class="btn btn-primary" type="submit">Sign in</button>
          <div class="actions-row">
            <button class="btn btn-secondary" id="quick-admin" type="button">Use admin demo</button>
            <button class="btn btn-secondary" id="quick-cashier" type="button">Use cashier demo</button>
          </div>
        </form>
        <p class="muted">Use the demo credentials <strong>admin@salesdesk.test</strong> / <strong>password</strong> for the admin view or <strong>cashier@salesdesk.test</strong> / <strong>password</strong> for the cashier workspace.</p>
        <p class="muted">New here? <a href="./register.html">Create an account</a></p>
      </section>
    </main>

    <script type="module">
      import { redirectIfAuthenticated, login } from '../shared/js/auth.js';
      import { showNotification } from '../shared/js/notifications.js';

      redirectIfAuthenticated();

      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('registered') === '1') {
        showNotification('Account created successfully. Please log in.', 'success');
      }

      const form = document.getElementById('login-form');
      const usernameInput = document.getElementById('username');
      const passwordInput = document.getElementById('password');

      async function submitCredentials(credentials) {
        try {
          const payload = await login(credentials);
          showNotification('Signed in successfully', 'success');
          const role = (payload.role || payload.user?.role || '').toString().toUpperCase();
          const destination = role === 'ADMIN' ? '../admin/dashboard.html' : '../cashier/dashboard.html';
          window.location.assign(destination);
        } catch (error) {
          showNotification(error.message || 'Unable to sign in. Please try again.', 'error');
        }
      }

      document.getElementById('quick-admin').addEventListener('click', () => {
        submitCredentials({ username: 'admin@salesdesk.test', password: 'password' });
      });

      document.getElementById('quick-cashier').addEventListener('click', () => {
        submitCredentials({ username: 'cashier@salesdesk.test', password: 'password' });
      });

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        submitCredentials({
          username: usernameInput.value.trim(),
          password: passwordInput.value
        });
      });
    </script>
  </body>
</html>
