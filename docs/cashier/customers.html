<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SalesDesk POS | Customers</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="../shared/css/design-tokens.css" />
    <link rel="stylesheet" href="../shared/css/base.css" />
    <link rel="stylesheet" href="../shared/css/components.css" />
    <link rel="stylesheet" href="../shared/css/layout.css" />
  </head>
  <body>
    <div id="layout-root"></div>
    <script type="module">
      import { requireRole } from '../shared/js/auth-guard.js';
      import { renderLayout } from '../shared/js/layout.js';
      import { demoCustomers } from '../shared/js/demo-data.js';
      if (!requireRole('CASHIER')) throw new Error('Unauthorized');
      renderLayout('Customers');
      document.querySelector('.content-wrapper').innerHTML = `
        <section class="card">
          <h2>Customer lookup</h2>
          <p class="muted">Support quick customer lookups, credit history, and account balances.</p>
          <div id="customer-table" class="table-list"></div>
        </section>
      `;
      document.getElementById('customer-table').innerHTML = demoCustomers.map((customer) => `
        <div class="list-row">
          <strong>${customer.name}</strong>
          <span>${customer.phone}</span>
          <span>Balance KES ${customer.balance}</span>
        </div>
      `).join('');
    </script>
  </body>
</html>
